# Config-as-code del servicio BACKEND (FastAPI).
# Railway lee este archivo en el servicio cuyo Root Directory es la raíz del repo.
# Nixpacks instala las deps desde requirements.txt (fiable); Python fijado en .python-version.
# El servicio frontend NO usa este archivo (su Root Directory es miniapp/, ver miniapp/railway.toml).
#
# Nota: Railway NO tiene un YAML único multi-servicio (a diferencia de docker-compose / render.yaml).
# La config es por-servicio; la topología (servicios, Postgres, dominio, variables) se crea en el
# dashboard/CLI. Ver miniapp/DEPLOY.md.

[build]
builder = "nixpacks"

[deploy]
# `python -m uvicorn` (no el script `uvicorn`) para no depender del PATH del venv.
# --host :: (IPv6) es obligatorio para la red privada de Railway; $PORT lo inyecta Railway.
startCommand = "python -m uvicorn backend.app.main:app --host :: --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
