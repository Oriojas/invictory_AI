# Config-as-code del servicio FRONTEND (Mini App).
# Railway lee este archivo en el servicio con Root Directory = miniapp/.
# Nixpacks detecta Node por package.json: instala deps, corre "build" (vite build) y luego "start"
# (server.js, que sirve dist/ y proxea /api al backend privado).

[build]
builder = "nixpacks"

[deploy]
# `node server.js` (no `npm start`): la imagen de runtime de Nixpacks trae `node` pero NO `npm`
# (npm es solo build-time), así que `npm start` daría "npm: command not found".
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
