# Config-as-code del servicio miniapp (Mini App).
# Railway lee este archivo en el servicio con Root Directory = miniapp/.
# Se construye con DOCKERFILE (determinista) en vez de Nixpacks, que no dejaba node/npm en runtime.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# El Dockerfile ya define CMD ["node","server.js"]; se deja explícito por claridad.
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
